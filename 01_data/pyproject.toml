[project]
name = "kys3b"
version = "0.1.0"
description = "Know Your Sources -- 3B scale-up data selection, rewriting and post-processing"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pyarrow>=15",
  "pyyaml>=6",
  "transformers>=4.46",
  "huggingface_hub>=0.25",
  "fasttext-wheel",
]

[project.optional-dependencies]
# vLLM is only needed by the rewriting worker; see scripts/00_setup_env.sh.
gpu = ["vllm==0.22.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
